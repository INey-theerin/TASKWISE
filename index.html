<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskWise — Interactive Prototype</title>
<style>
:root{--bg:#f7f7f2;--card:#fff;--ink:#152d29;--muted:#65736e;--line:#e1e7df;--accent:#235d49;--soft:#eaf2e8;--warn:#a34c22}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Tahoma,Arial,sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);padding:9px 14px;border-radius:10px}button:hover{border-color:var(--accent);background:var(--soft)}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#174735;color:white}.danger{color:#ab382c}.shell{display:grid;grid-template-columns:226px 1fr;min-height:100vh}aside{background:#fff;border-right:1px solid var(--line);padding:30px 20px;position:sticky;top:0;height:100vh}.brand{font-size:28px;font-weight:bold;letter-spacing:-1px}.brand i{font-style:normal;color:#d7853c}aside p{color:var(--muted);font-size:12px;margin-top:0}nav{display:grid;gap:7px;margin-top:40px}nav button{text-align:left;border:0;padding:13px;background:transparent}nav button.active{background:var(--soft);color:var(--accent);font-weight:bold}.aside-note{margin-top:38px;font-size:12px;color:var(--muted)}main{padding:24px 42px 60px;max-width:1460px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:24px;border-bottom:1px solid var(--line)}.top small{color:var(--muted)}.top-actions,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.page-head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 22px;gap:16px}h1{font-size:30px;line-height:1.4;margin:0 0 6px}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0 0 7px}p{margin:6px 0 12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:bold}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:22px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}.stat strong{display:block;font-size:30px;margin:4px 0}.stat small{color:var(--muted)}.two{grid-template-columns:minmax(0,1.65fr) minmax(260px,1fr)}.three{grid-template-columns:repeat(3,1fr)}.hero{background:var(--accent);color:white}.hero .muted{color:#d5e4dc}.hero button{margin-top:10px}.task{display:flex;justify-content:space-between;gap:15px;padding:17px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task p{font-size:13px;margin:3px 0;color:var(--muted)}.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:6px;background:var(--soft);margin:2px 4px 2px 0}.warn{background:#fff2df;color:#88451e}.note{padding:13px 16px;background:var(--soft);border-radius:10px;font-size:13px;margin:12px 0}.alert{border-left:4px solid #dd8c42;background:#fff6e9;padding:14px;margin:12px 0;border-radius:6px}.empty{text-align:center;padding:30px;color:var(--muted)}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}input,select{width:100%;padding:10px;border:1px solid #b9c7bf;border-radius:8px;background:white;color:var(--ink)}input[type=checkbox]{width:auto;accent-color:var(--accent);margin-right:10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.field-full{grid-column:1/-1}dialog{border:0;border-radius:18px;width:min(600px,95vw);max-height:90vh;padding:28px;box-shadow:0 20px 90px #18302540}dialog::backdrop{background:#10251d70}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head button{border:0}.subtask{display:flex;align-items:center;gap:8px;padding:9px 0}.subtask label{margin:0;flex:1;font-weight:normal}progress{width:100%;height:12px;accent-color:var(--accent)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--soft)}.table-wrap{overflow:auto}.calendar{display:grid;grid-template-columns:repeat(7,minmax(125px,1fr));gap:8px;overflow:auto;padding-bottom:12px}.day{border:1px solid var(--line);border-radius:12px;background:white;min-height:235px;padding:12px}.day h3{font-size:13px}.slot{background:var(--soft);padding:10px;border-radius:8px;margin-top:8px;font-size:12px}.slot button{font-size:11px;padding:4px 7px;margin-top:7px}.due{border-left:3px solid #d58c47;padding-left:7px;margin-top:12px;font-size:11px}.timer{font-size:64px;font-weight:bold;letter-spacing:2px;text-align:center;padding:18px}.focus-panel{max-width:650px;margin:auto}.center{text-align:center}.badge{padding:16px;border-radius:12px;background:var(--soft);text-align:center}.locked{opacity:.45}.error{color:#ac372d;font-size:13px;margin:10px 0}.foot{font-size:11px;color:var(--muted);margin-top:32px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#15382b;color:white;padding:12px 22px;border-radius:10px;z-index:10;display:none}.flow{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}.flow strong{display:block}.flow p{color:var(--muted)}.wire{--bg:#f5f5f5;--card:#fff;--ink:#222;--muted:#666;--line:#999;--accent:#333;--soft:#eee;--warn:#444}.wire{filter:grayscale(1)}.wire *{box-shadow:none!important;border-radius:0!important}.wire .hero{background:#eee;color:#222;border:2px dashed #666}.wire .hero .muted{color:#555}.wire .warn,.wire .alert{background:#eee;color:#333}.wire .alert,.wire .due{border-color:#666}.wire .brand i{color:#444}.wire .card{border-style:dashed}.wire-banner{display:none;background:#ddd;padding:7px 18px;text-align:center;font-size:12px}.wire .wire-banner{display:block}.rank{font-size:22px;font-weight:bold;min-width:30px;color:var(--accent)}.line{display:flex;gap:12px;align-items:center}a{color:var(--accent)}@media(max-width:1000px){main{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.three{grid-template-columns:1fr}.shell{grid-template-columns:185px 1fr}aside{padding:25px 12px}}@media(max-width:680px){.shell{display:block}aside{position:static;height:auto;border-bottom:1px solid var(--line);padding:14px}.brand{font-size:23px}aside p,.aside-note{display:none}nav{display:flex;overflow:auto;margin:12px 0 0;gap:2px}nav button{white-space:nowrap;font-size:12px;padding:9px}.top{align-items:flex-start;flex-direction:column}.page-head{align-items:flex-start}h1{font-size:24px}.fields{grid-template-columns:1fr}.stats{gap:9px}.stat,.card{padding:16px}.task{flex-direction:column}.timer{font-size:52px}}
</style></head><body><div class="wire-banner">WIREFRAME · โครงหน้าจอความละเอียดต่ำ · กดทดสอบ Flow ได้</div><div class="shell"><aside><div class="brand">TaskWise<i>●</i></div><p>วางแผนให้พอดีกับวันของคุณ</p><nav id="nav"></nav><div class="aside-note">HCI TERM PROJECT<br>ต้นแบบสำหรับทดสอบผู้ใช้<br>ข้อมูลเก็บเฉพาะเบราว์เซอร์นี้</div></aside><main><header class="top"><div><span class="eyebrow">YOUR WORK, IN BALANCE</span><br><small id="today"></small></div><div class="top-actions"><button id="mode" onclick="toggleMode()">ดู Wireframe</button><button onclick="go('guide')">คู่มือทดสอบ</button><button onclick="resetData()">เริ่มข้อมูลตัวอย่างใหม่</button></div></header><div id="view"></div><p class="foot">ต้นแบบ TaskWise • ใช้ข้อมูลสมมติ • การแจ้งเตือนแสดงภายในหน้านี้ • ไม่เชื่อมบัญชีจริงและไม่บล็อกแอปอื่นบนเครื่อง</p></main></div><dialog id="modal"></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=(n=0)=>{let d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pretty=d=>new Date(d+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'}),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const seed=()=>({tasks:[{id:'a',name:'ออกแบบ Prototype HCI',course:'HCI',due:dateKey(2),score:30,difficulty:4,hours:5,done:false,subs:[{name:'ร่าง Wireframe',done:true},{name:'เชื่อมหน้าจอ',done:false},{name:'เตรียมโจทย์ทดสอบ',done:false}]},{id:'b',name:'แบบฝึกหัด Data Structures',course:'Data Structures',due:dateKey(1),score:10,difficulty:5,hours:3,done:false,subs:[{name:'อ่านโจทย์และวางวิธีทำ',done:false},{name:'เขียนและตรวจโค้ด',done:false}]},{id:'c',name:'สรุปบทความวิจัย',course:'Research',due:dateKey(4),score:20,difficulty:3,hours:4,done:false,subs:[]}],slots:[{id:'s1',task:'a',date:dateKey(),time:'18:00',minutes:120},{id:'s2',task:'b',date:dateKey(),time:'19:00',minutes:120},{id:'s3',task:'c',date:dateKey(),time:'20:00',minutes:90}],capacity:3,availableStart:'17:00',availableEnd:'22:00',order:null,focusDays:[],sessions:0});
let state;try{state=JSON.parse(localStorage.getItem('taskwise-v1'))||seed()}catch{state=seed()}
let page='home',wire=location.hash==='#wireframe',week=0,timer=null,focus={running:false,remaining:1500,duration:25,task:'a',blocked:[],phase:'work'};
function save(){try{localStorage.setItem('taskwise-v1',JSON.stringify(state))}catch{toast('บันทึกถาวรไม่ได้ ข้อมูลจะอยู่ในหน้านี้จนกว่าจะปิด')}}
function toast(m){$('toast').textContent=m;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',4000)}
function go(p){page=p;render();window.scrollTo(0,0)}function closeModal(){$('modal').close()}function openModal(html){$('modal').innerHTML=html;$('modal').showModal()}
function toggleMode(){wire=!wire;document.body.classList.toggle('wire',wire);$('mode').textContent=wire?'ดู Interactive Prototype':'ดู Wireframe'}
function resetData(){openModal('<h2>เริ่มการทดสอบรอบใหม่?</h2><p>ล้างการเปลี่ยนแปลงในต้นแบบและกลับสู่ข้อมูลสมมติ 3 งาน</p><div class="actions"><button onclick="closeModal()">ยกเลิก</button><button class="primary" onclick="confirmReset()">เริ่มใหม่</button></div>')}
function confirmReset(){clearInterval(timer);timer=null;focus.running=false;focus.remaining=1500;focus.duration=25;focus.task='a';focus.blocked=[];focus.phase='work';state=seed();save();closeModal();go('home');toast('พร้อมสำหรับผู้ทดสอบคนถัดไป')}
const task=id=>state.tasks.find(t=>t.id===id),active=()=>state.tasks.filter(t=>!t.done),days=t=>Math.ceil((new Date(t.due+'T00:00:00')-new Date(dateKey()+'T00:00:00'))/86400000);
function points(t){return Math.max(0,40-8*Math.max(0,days(t)))+Math.min(25,t.score*.5)+t.difficulty*4+Math.min(15,t.hours*2)}
function ranked(){let a=active().sort((a,b)=>points(b)-points(a));if(state.order)a.sort((a,b)=>state.order.indexOf(a.id)-state.order.indexOf(b.id));return a}
const progress=t=>t.done?100:t.subs.length?Math.round(t.subs.filter(s=>s.done).length/t.subs.length*100):0;
const mins=s=>{let [h,m]=s.split(':').map(Number);return h*60+m},hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function conflicts(){let a=state.slots.filter(s=>task(s.task)&&!task(s.task).done),out=[];a.forEach((s,i)=>a.slice(i+1).forEach(t=>{if(s.date===t.date&&mins(s.time)<mins(t.time)+t.minutes&&mins(t.time)<mins(s.time)+s.minutes)out.push([s,t])}));return out}
function loads(){let m={};state.slots.filter(s=>task(s.task)&&!task(s.task).done).forEach(s=>m[s.date]=(m[s.date]||0)+s.minutes);return Object.entries(m).filter(([d,n])=>n>state.capacity*60)}
function head(title,sub,action=''){return `<div class="page-head"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}
function taskRow(t){return `<div class="task"><div><span class="tag">${esc(t.course)}</span><span class="tag ${days(t)<=1?'warn':''}">ส่ง ${pretty(t.due)}</span><h3>${esc(t.name)}</h3><p>เหลือประมาณ ${t.hours} ชม. · คะแนนงาน ${t.score} · ความยาก ${t.difficulty}/5</p><progress value="${progress(t)}" max="100" aria-label="ความคืบหน้า"></progress><p>เสร็จ ${progress(t)}%</p></div><div class="actions"><button onclick="detail('${t.id}')">ดูงานย่อย</button><button onclick="editTask('${t.id}')">แก้ไข</button></div></div>`}
function render(){document.body.classList.toggle('wire',wire);$('mode').textContent=wire?'ดู Interactive Prototype':'ดู Wireframe';$('today').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});let nav=[['home','ภาพรวม'],['tasks','งานทั้งหมด'],['priority','ลำดับความสำคัญ'],['plan','ตารางเวลา'],['alerts','ภาระงานและแจ้งเตือน'],['focus','สมาธิและรางวัล']];$('nav').innerHTML=nav.map(([p,n])=>`<button class="${page===p?'active':''}" ${page===p?'aria-current="page"':''} onclick="go('${p}')">${n}</button>`).join('');({home:homeView,tasks:tasksView,priority:priorityView,plan:planView,alerts:alertsView,focus:focusView,guide:guideView}[page]||homeView)()}
function homeView(){let next=ranked()[0];$('view').innerHTML=head('ค่อย ๆ ทำให้ครบ ทีละงาน','เห็นงานที่สำคัญ แล้วจัดเวลาให้พอดี',`<button class="primary" onclick="editTask()">＋ เพิ่มงาน</button>`)+`<div class="grid stats"><div class="stat"><small>งานที่ยังต้องทำ</small><strong>${active().length}</strong>งาน</div><div class="stat"><small>เวลาโดยประมาณที่เหลือ</small><strong>${active().reduce((a,t)=>a+t.hours,0)}</strong>ชั่วโมง</div><div class="stat"><small>ช่วงเวลาทับซ้อน</small><strong>${conflicts().length}</strong>คู่ที่ควรตรวจสอบ</div><div class="stat"><small>งานเสร็จแล้ว</small><strong>${state.tasks.filter(t=>t.done).length}</strong>งาน</div></div><div class="grid two"><section class="card"><h2>งานที่แนะนำให้เริ่ม</h2>${ranked().slice(0,3).map(taskRow).join('')||'<p class="empty">ไม่มีงานค้าง เพิ่มงานใหม่เมื่อพร้อม</p>'}<button onclick="go('priority')">ดูเหตุผลและปรับลำดับ →</button></section><div class="grid"><section class="card hero"><span class="eyebrow" style="color:inherit">MAKE ROOM TO FOCUS</span><h2>ให้เวลากับงานตรงหน้า</h2><p class="muted">${next?esc(next.name):'เริ่มงานใหม่ แล้วค่อยแบ่งเวลาทำ'}</p><button onclick="go('focus')">เริ่มช่วงมีสมาธิ →</button></section><section class="card"><h2>แผนวันนี้เป็นอย่างไร?</h2><p>${loads().length} วันที่มีงานเกินเวลาที่ตั้งไว้<br>${conflicts().length} คู่เวลาที่ทับซ้อนกัน</p><button onclick="go('alerts')">ตรวจและปรับแผน</button></section></div></div>`}
function tasksView(){$('view').innerHTML=head('งานทั้งหมด','จัดการงานทุกวิชาในที่เดียว',`<button class="primary" onclick="editTask()">＋ เพิ่มงาน</button>`)+`<section class="card">${active().map(taskRow).join('')||'<div class="empty">ยังไม่มีงานที่ค้างอยู่</div>'}</section><section class="card" style="margin-top:20px"><h2>ทำเสร็จแล้ว</h2>${state.tasks.filter(t=>t.done).map(t=>`<div class="task"><div>${esc(t.name)} <span class="tag">เสร็จแล้ว</span></div><button onclick="reopen('${t.id}')">นำกลับมาทำต่อ</button></div>`).join('')||'<p class="muted">งานที่ทำเสร็จจะปรากฏที่นี่</p>'}</section>`}
function editTask(id){let t=id?task(id):{name:'',course:'',due:dateKey(2),score:10,difficulty:3,hours:2};openModal(`<div class="dialog-head"><h2>${id?'แก้ไขงาน':'เพิ่มงานใหม่'}</h2><button onclick="closeModal()" aria-label="ปิด">×</button></div><form onsubmit="saveTask(event,'${id||''}')"><div class="fields"><div class="field-full"><label for="name">ชื่องาน *</label><input id="name" required maxlength="100" value="${esc(t.name)}"></div><div><label for="course">วิชา *</label><input id="course" required maxlength="60" value="${esc(t.course)}"></div><div><label for="due">กำหนดส่ง *</label><input id="due" required type="date" value="${t.due}"></div><div><label for="score">คะแนนของงาน (0–100)</label><input id="score" type="number" required min="0" max="100" value="${t.score}"></div><div><label for="difficulty">ความยาก</label><select id="difficulty">${[1,2,3,4,5].map(i=>`<option value="${i}" ${t.difficulty===i?'selected':''}>${i} / 5 ${i===1?'ง่าย':i===5?'ยากมาก':''}</option>`).join('')}</select></div><div class="field-full"><label for="hours">เวลาที่คาดว่ายังต้องใช้ (ชั่วโมง)</label><input id="hours" type="number" required min="0.25" max="200" step="0.25" value="${t.hours}"></div></div><p class="note">แก้เวลาประเมินได้เมื่อเริ่มทำจริง ระบบใช้ข้อมูลนี้ประกอบคำแนะนำ</p><p id="taskError" class="error" role="alert"></p><div class="actions"><button type="button" onclick="closeModal()">ยกเลิก</button><button class="primary">บันทึกงาน</button></div></form>`)}
function saveTask(e,id){e.preventDefault();let name=$('name').value.trim(),course=$('course').value.trim();if(!name||!course){$('taskError').textContent='กรุณากรอกชื่องานและวิชา';return}let fields={name,course,due:$('due').value,score:+$('score').value,difficulty:+$('difficulty').value,hours:+$('hours').value};if(id)Object.assign(task(id),fields);else state.tasks.push({id:uid(),...fields,done:false,subs:[]});state.order=null;save();closeModal();render();toast('บันทึกแล้ว และอัปเดตคำแนะนำลำดับงาน')}
function priorityView(){let list=ranked();$('view').innerHTML=head('เลือกงานที่ควรเริ่มก่อน','ตรวจเหตุผล แล้วปรับให้เหมาะกับสถานการณ์ของคุณ')+`<section class="card"><div class="actions"><button onclick="state.order=null;save();render()">ใช้ลำดับแนะนำ</button><button onclick="sortBy('due')">เรียงตามวันส่ง</button><button onclick="sortBy('score')">เรียงตามคะแนนงาน</button></div><details class="note"><summary>คะแนนความสำคัญคิดอย่างไร?</summary><p>สูตรจำลองสำหรับต้นแบบ: ความใกล้วันส่ง 0–40 + คะแนนงาน 0–25 + ความยาก 4–20 + เวลาที่เหลือ 0–15 รวมสูงสุด 100 คะแนน ยังไม่ได้ปรับเทียบด้วยข้อมูลจริง ผู้ใช้เปลี่ยนลำดับได้เสมอ</p></details>${list.map((t,i)=>`<div class="task"><div class="line"><span class="rank">${i+1}</span><div><h3>${esc(t.name)}</h3><span class="tag">Priority ${Math.round(points(t))}/100</span><p>${days(t)<0?'เกินกำหนดแล้ว':`เหลือ ${days(t)} วัน`} · ความยาก ${t.difficulty}/5 · ต้องใช้ ${t.hours} ชม. · คะแนนงาน ${t.score}</p></div></div><div class="actions"><button ${i===0?'disabled':''} onclick="moveRank('${t.id}',-1)" aria-label="เลื่อน ${esc(t.name)} ขึ้น">↑</button><button ${i===list.length-1?'disabled':''} onclick="moveRank('${t.id}',1)" aria-label="เลื่อน ${esc(t.name)} ลง">↓</button><button onclick="slotForm('', '${t.id}')">จัดเวลา</button></div></div>`).join('')||'<p class="empty">ไม่มีงานให้จัดลำดับ</p>'}</section>`}
function sortBy(k){state.order=active().sort((a,b)=>k==='due'?a.due.localeCompare(b.due):b.score-a.score).map(t=>t.id);save();render();toast('เปลี่ยนลำดับแล้ว')}
function moveRank(id,dir){let ids=ranked().map(t=>t.id),i=ids.indexOf(id);[ids[i],ids[i+dir]]=[ids[i+dir],ids[i]];state.order=ids;save();render()}
function detail(id){let t=task(id);openModal(`<div class="dialog-head"><h2>${esc(t.name)}</h2><button onclick="closeModal()" aria-label="ปิด">×</button></div><p class="muted">${esc(t.course)} · ส่ง ${pretty(t.due)}</p><progress value="${progress(t)}" max="100"></progress><p>เสร็จ ${t.subs.filter(s=>s.done).length}/${t.subs.length} ขั้นตอน (${progress(t)}%)</p>${t.subs.map((s,i)=>`<div class="subtask"><label><input type="checkbox" ${s.done?'checked':''} onchange="checkSub('${id}',${i},this.checked)">${esc(s.name)}</label><button onclick="removeSub('${id}',${i})" aria-label="ลบขั้นตอน ${esc(s.name)}">ลบ</button></div>`).join('')||'<p class="empty">แบ่งงานเป็นขั้นตอนเล็ก ๆ เพื่อเริ่มได้ง่ายขึ้น</p>'}<form onsubmit="addSub(event,'${id}')"><label for="subname">ขั้นตอนใหม่</label><div class="line"><input id="subname" required maxlength="100" placeholder="เช่น ร่างโครงหน้าจอ"><button>เพิ่ม</button></div></form><div class="actions" style="margin-top:20px"><button onclick="closeModal();slotForm('', '${id}')">จัดเวลาทำงาน</button><button class="primary" onclick="complete('${id}')" ${t.subs.some(s=>!s.done)?'disabled':''}>ทำงานนี้เสร็จแล้ว</button></div>${t.subs.some(s=>!s.done)?'<p class="muted">ทำรายการย่อยให้ครบก่อนปิดงาน</p>':''}`)}
function checkSub(id,i,v){task(id).subs[i].done=v;save();detailRefresh(id)}function detailRefresh(id){closeModal();render();detail(id)}function addSub(e,id){e.preventDefault();let n=$('subname').value.trim();if(!n)return;task(id).subs.push({name:n,done:false});save();detailRefresh(id)}function removeSub(id,i){task(id).subs.splice(i,1);save();detailRefresh(id)}function complete(id){task(id).done=true;state.order=null;save();closeModal();render();toast('งานเสร็จแล้ว! ตรวจรางวัลได้ในหน้าสมาธิและรางวัล')}function reopen(id){task(id).done=false;save();render()}
function planView(){$('view').innerHTML=head('จัดเวลาให้แต่ละงาน','รวมทุกวิชาไว้ในแผนเดียว และเผื่อเวลาให้ชีวิตประจำวัน',`<button class="primary" onclick="slotForm()" ${!active().length?'disabled':''}>＋ เพิ่มช่วงทำงาน</button>`)+`<div class="card" style="margin-bottom:20px"><form onsubmit="saveAvailability(event)"><div class="fields"><div><label for="cap">เวลาทำงานสูงสุดต่อวัน (ชั่วโมง)</label><input id="cap" type="number" min="0.5" max="12" step="0.5" required value="${state.capacity}"></div><div><label>ช่วงเวลาว่างต่อวัน</label><div class="line"><input id="avStart" type="time" required aria-label="เริ่มเวลาว่าง" value="${state.availableStart}"><span>ถึง</span><input id="avEnd" type="time" required aria-label="สิ้นสุดเวลาว่าง" value="${state.availableEnd}"></div></div></div><p id="avError" class="error"></p><button>บันทึกเวลาว่าง</button></form></div><div class="actions" style="margin-bottom:12px"><button onclick="week--;render()">← ก่อนหน้า</button><button onclick="week=0;render()">วันนี้</button><button onclick="week++;render()">ถัดไป →</button></div><div class="calendar">${Array.from({length:7},(_,i)=>{let date=dateKey(week*7+i),slots=state.slots.filter(s=>s.date===date&&task(s.task)&&!task(s.task).done).sort((a,b)=>a.time.localeCompare(b.time)),total=slots.reduce((a,s)=>a+s.minutes,0);return `<section class="day"><h3>${pretty(date)} ${date===dateKey()?'· วันนี้':''}</h3><small class="${total>state.capacity*60?'warn':''}">${(total/60).toFixed(1)} / ${state.capacity} ชม.</small>${slots.map(s=>`<div class="slot"><strong>${s.time}–${hm(mins(s.time)+s.minutes)}</strong><br>${esc(task(s.task).name)}<br><button onclick="slotForm('${s.id}')">แก้เวลา</button></div>`).join('')}${active().filter(t=>t.due===date).map(t=>`<div class="due">กำหนดส่ง: ${esc(t.name)}</div>`).join('')}</section>`}).join('')}</div><section class="card"><h2>เวลาที่วางแผนเทียบกับเวลาที่ต้องใช้</h2>${active().map(t=>{let n=state.slots.filter(s=>s.task===t.id&&s.date>=dateKey()).reduce((a,s)=>a+s.minutes,0)/60;return `<div class="task"><div>${esc(t.name)}<p>จัดไว้ ${n.toFixed(1)} / ต้องใช้ ${t.hours} ชั่วโมง</p></div><button onclick="slotForm('', '${t.id}')">เพิ่มช่วงเวลา</button></div>`}).join('')}</section>`}
function saveAvailability(e){e.preventDefault();if($('avStart').value>=$('avEnd').value){$('avError').textContent='เวลาสิ้นสุดต้องอยู่หลังเวลาเริ่ม';return}state.capacity=+$('cap').value;state.availableStart=$('avStart').value;state.availableEnd=$('avEnd').value;save();render();toast('อัปเดตเวลาว่างและตรวจภาระงานแล้ว')}
function slotForm(id='',tid=''){if(!active().length){toast('เพิ่มงานก่อนจัดเวลา');return}let s=id?state.slots.find(s=>s.id===id):{task:tid||active()[0].id,date:dateKey(),time:state.availableStart,minutes:60};openModal(`<div class="dialog-head"><h2>${id?'ปรับช่วงทำงาน':'เพิ่มช่วงทำงาน'}</h2><button onclick="closeModal()" aria-label="ปิด">×</button></div><form onsubmit="saveSlot(event,'${id}')"><label for="slotTask">งาน</label><select id="slotTask">${active().map(t=>`<option value="${t.id}" ${s.task===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div class="fields"><div><label for="slotDate">วันที่</label><input id="slotDate" type="date" min="${dateKey()}" required value="${s.date}"></div><div><label for="slotTime">เวลาเริ่ม</label><input id="slotTime" type="time" required value="${s.time}"></div><div><label for="slotMinutes">ระยะเวลา (นาที)</label><input id="slotMinutes" type="number" required min="15" max="480" step="15" value="${s.minutes}"></div></div><p id="slotError" class="error" role="alert"></p><div class="actions"><button type="button" onclick="closeModal()">ยกเลิก</button>${id?`<button class="danger" type="button" onclick="removeSlot('${id}')">ลบช่วงนี้</button>`:''}<button class="primary">ตรวจและบันทึก</button></div></form>`)}
function saveSlot(e,id){e.preventDefault();let s={id:id||uid(),task:$('slotTask').value,date:$('slotDate').value,time:$('slotTime').value,minutes:+$('slotMinutes').value},end=mins(s.time)+s.minutes,other=state.slots.filter(x=>x.id!==id&&task(x.task)&&!task(x.task).done);let err='';if(end>1440)err='ช่วงทำงานต้องสิ้นสุดภายในวันเดียวกัน';else if(s.date>task(s.task).due)err='ช่วงเวลานี้เลยกำหนดส่ง กรุณาเลือกวันก่อนหรือเท่ากับวันส่ง';else if(mins(s.time)<mins(state.availableStart)||end>mins(state.availableEnd))err='อยู่นอกเวลาว่างที่ตั้งไว้ กรุณาเลือกเวลาใหม่หรือแก้เวลาว่าง';else {let clash=other.find(x=>x.date===s.date&&mins(x.time)<end&&mins(s.time)<mins(x.time)+x.minutes);if(clash)err='เวลาทับซ้อนกับ “'+task(clash.task).name+'” กรุณาเลือกเวลาอื่น'}if(err){$('slotError').textContent=err;return}if(id)state.slots=state.slots.map(x=>x.id===id?s:x);else state.slots.push(s);save();closeModal();render();toast('บันทึกช่วงทำงานแล้ว'+(loads().some(([d])=>d===s.date)?' · วันนี้เกินเวลาที่ตั้งไว้ ดูที่ภาระงานและแจ้งเตือน':''))}
function removeSlot(id){state.slots=state.slots.filter(s=>s.id!==id);save();closeModal();render();toast('ลบช่วงทำงานแล้ว งานยังอยู่ในรายการ')}
function alertsView(){let cs=conflicts(),ls=loads(),due=active().filter(t=>days(t)<=2);$('view').innerHTML=head('ดูภาระงานก่อนล้นมือ','ตรวจเวลาทับซ้อน งานกระจุกตัว และงานใกล้ส่ง')+`<div class="grid two"><section class="card"><h2>เวลาที่ทับซ้อน · ${cs.length}</h2>${cs.map(([a,b])=>`<div class="alert"><strong>${pretty(a.date)} · ช่วงเวลาทับซ้อน</strong><p>${esc(task(a.task).name)} (${a.time}–${hm(mins(a.time)+a.minutes)})<br>${esc(task(b.task).name)} (${b.time}–${hm(mins(b.time)+b.minutes)})</p><button onclick="slotForm('${b.id}')">ปรับเวลา ${esc(task(b.task).course)}</button></div>`).join('')||'<p class="muted">ไม่มีเวลาทับซ้อนแล้ว</p>'}<h2 style="margin-top:22px">ภาระงานเกินกำลัง · ${ls.length}</h2>${ls.map(([d,m])=>`<div class="alert"><strong>${pretty(d)} · จัดไว้ ${(m/60).toFixed(1)} ชั่วโมง</strong><p>เกินเวลาว่างที่กำหนดไว้ ${state.capacity} ชั่วโมงต่อวัน</p><button onclick="go('plan')">แบ่งหรือย้ายช่วงทำงาน</button></div>`).join('')||'<p class="muted">ทุกวันอยู่ในขอบเขตเวลาที่ตั้งไว้</p>'}</section><section class="card"><h2>แจ้งเตือนงานใกล้ส่ง</h2><p class="muted">จำลองการเตือนภายในแอป สำหรับงานที่ส่งภายใน 2 วัน</p>${due.map(t=>`<div class="task"><div><span class="tag warn">${days(t)<0?'เกินกำหนด':days(t)===0?'ส่งวันนี้':`อีก ${days(t)} วัน`}</span><h3>${esc(t.name)}</h3><p>${esc(t.course)} · ${pretty(t.due)}<br>ขั้นตอนที่ยังค้าง: ${t.subs.filter(s=>!s.done).length} · เหลือประมาณ ${t.hours} ชั่วโมง</p><button onclick="detail('${t.id}')">เปิดงาน</button></div></div>`).join('')||'<p class="empty">ไม่มีงานใกล้กำหนดส่ง</p>'}</section></div>`}
function streak(){let n=0,d=0;if(!state.focusDays.includes(dateKey()))d=1;while(state.focusDays.includes(dateKey(-d))){n++;d++}return n}
function focusView(){let finished=state.tasks.filter(t=>t.done).length;$('view').innerHTML=head('ให้เวลากับสมาธิ','ทำทีละช่วง พักให้พอ แล้วค่อยกลับมาทำต่อ')+`<div class="grid two"><section class="card"><div class="focus-panel"><label for="focusTask">งานที่ต้องการโฟกัส</label><select id="focusTask" ${focus.running?'disabled':''}>${active().map(t=>`<option value="${t.id}" ${focus.task===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div class="fields"><div><label for="focusDuration">เวลาทำงาน</label><select id="focusDuration" ${focus.running?'disabled':''}>${[15,25,45].map(n=>`<option value="${n}" ${focus.duration===n?'selected':''}>${n} นาที</option>`).join('')}</select></div><div><label>ช่วงปัจจุบัน</label><p id="phase">${focus.phase==='break'?'พัก 5 นาที':'ทำงาน'}</p></div></div><label>สิ่งรบกวนที่ต้องการบล็อก (จำลอง)</label>${['โซเชียลมีเดีย','วิดีโอ','เกม'].map(n=>`<label style="font-weight:normal"><input type="checkbox" class="block-choice" value="${n}" ${focus.blocked.includes(n)?'checked':''} ${focus.running?'disabled':''}>${n}</label>`).join('')}<p class="note">ต้นแบบจะแสดงสถานะบล็อกเพื่อทดสอบ Flow เท่านั้น ไม่ปิดกั้นเว็บไซต์หรือแอปจริง</p><div id="timerDisplay" class="timer">${timerText()}</div><p id="blockStatus" class="center muted">${focus.running?(focus.phase==='break'?'กำลังพัก · พักสายตาและยืดเส้นได้เลย':'กำลังโฟกัส · จำลองบล็อก '+(focus.blocked.join(', ')||'ไม่ได้เลือกสิ่งรบกวน')):'พร้อมเมื่อคุณพร้อม'}</p><div class="actions" style="justify-content:center"><button class="primary" ${!active().length?'disabled':''} onclick="startFocus()">${focus.running?'กำลังจับเวลา':timer?'ทำต่อ':'เริ่มจับเวลา'}</button><button onclick="pauseFocus()">หยุดชั่วคราว</button><button onclick="cancelFocus()">ยกเลิกรอบ</button></div><details style="margin-top:20px"><summary>ตัวควบคุมสำหรับทดสอบ</summary><p class="muted">ข้ามเวลาเพื่อดูหน้าจอจบรอบและรับรางวัล โดยไม่ต้องรอจริง</p><button onclick="finishPhase()" ${!timer?'disabled':''}>จำลองครบเวลา</button></details>${!active().length?'<p class="note">เพิ่มงานหรือเปิดงานที่เสร็จแล้วกลับมาก่อนเริ่มโฟกัส</p>':''}</div></section><div class="grid"><section class="card"><h2>ความสม่ำเสมอของคุณ</h2><div class="grid stats" style="grid-template-columns:1fr 1fr"><div><strong style="font-size:34px">${streak()}</strong><p>วันต่อเนื่อง</p></div><div><strong style="font-size:34px">${state.sessions}</strong><p>รอบที่ทำครบ</p></div></div><p class="muted">นับวันที่ทำรอบโฟกัสครบอย่างน้อย 1 รอบ การข้ามเวลาในต้นแบบนับเป็นรอบจำลองด้วย</p></section><section class="card"><h2>Achievement Badges</h2><div class="badge ${state.sessions<1?'locked':''}"><strong>ก้าวแรกของสมาธิ</strong><br>ทำรอบโฟกัสครบ 1 รอบ ${state.sessions>=1?'✓':'· ยังไม่ปลดล็อก'}</div><div class="badge ${finished<1?'locked':''}" style="margin-top:10px"><strong>ปิดงานแรก</strong><br>ทำงานเสร็จ 1 ชิ้น ${finished>=1?'✓':'· ยังไม่ปลดล็อก'}</div><div class="badge ${streak()<3?'locked':''}" style="margin-top:10px"><strong>สม่ำเสมอ 3 วัน</strong><br>โฟกัสครบ 3 วันติดกัน ${streak()>=3?'✓':'· ยังไม่ปลดล็อก'}</div></section></div></div>`}
function timerText(){return String(Math.floor(focus.remaining/60)).padStart(2,'0')+':'+String(focus.remaining%60).padStart(2,'0')}
function startFocus(){if(focus.running)return;if(!timer){focus.task=$('focusTask').value;focus.duration=+$('focusDuration').value;focus.remaining=focus.phase==='break'?300:focus.duration*60;focus.blocked=[...document.querySelectorAll('.block-choice:checked')].map(x=>x.value)}focus.running=true;clearInterval(timer);let last=Date.now();timer=setInterval(()=>{if(!focus.running)return;let now=Date.now(),elapsed=Math.floor((now-last)/1000);if(elapsed){last+=elapsed*1000;focus.remaining=Math.max(0,focus.remaining-elapsed);if($('timerDisplay'))$('timerDisplay').textContent=timerText();if(focus.remaining===0)finishPhase()}},250);render()}
function pauseFocus(){if(!timer)return;focus.running=false;render();toast('หยุดชั่วคราว กดทำต่อเพื่อจับเวลาต่อ')}
function cancelFocus(){clearInterval(timer);timer=null;focus.running=false;focus.phase='work';focus.remaining=focus.duration*60;render();toast('ยกเลิกรอบแล้ว ไม่นับเป็นรอบที่ทำครบ')}
function finishPhase(){if(!timer)return;clearInterval(timer);timer=null;focus.running=false;if(focus.phase==='work'){state.sessions++;if(!state.focusDays.includes(dateKey()))state.focusDays.push(dateKey());save();focus.phase='break';focus.remaining=300;openModal('<h2>ทำได้ดี ได้เวลาพักแล้ว</h2><p>บันทึกรอบโฟกัสแล้ว แนะนำให้พัก 5 นาที ลุกยืดเส้นหรือพักสายตา</p><div class="actions"><button onclick="closeModal();focus.phase=\'work\';focus.remaining=focus.duration*60;go(\'focus\')">กลับไปเลือกงาน</button><button class="primary" onclick="closeModal();go(\'focus\');startFocus()">เริ่มพัก 5 นาที</button></div>')}else{focus.phase='work';focus.remaining=focus.duration*60;toast('พักครบแล้ว พร้อมเริ่มรอบถัดไป')}render()}
function guideView(){let flows=[['1 · Priority Management','เพิ่มงาน → กรอกวันส่ง คะแนน ความยาก เวลา → ดูคะแนนความสำคัญ → อ่านเหตุผล → เปลี่ยนวิธีเรียงหรือเลื่อนลำดับ','เพิ่มรายงานวิชาใหม่ที่ส่งพรุ่งนี้ คะแนน 20 ความยาก 4 ใช้เวลา 3 ชั่วโมง แล้วเลือกงานที่จะทำก่อน','บันทึกงานสำเร็จ อธิบายเหตุผลได้ และเปลี่ยนลำดับได้'],['2 · Time Planning','ตั้งเวลาว่าง → ดูเวลาที่ต้องใช้ → เลือกงาน → เพิ่มช่วงทำงาน → ดูปฏิทินและเวลาที่จัดไว้','แบ่งงาน HCI เป็นสองช่วง ช่วงละ 60 นาที ภายในวันส่ง','เห็นสองช่วงในปฏิทินและตรวจเวลารวมได้'],['3 · Task Breakdown','เปิดงาน → เพิ่มงานย่อย → ติ๊ก Checklist → ดู Progress → ปิดงาน','เพิ่มขั้นตอน “เตรียมโจทย์ทดสอบ” แล้วทำรายการทั้งหมดให้ครบ','Progress เปลี่ยนตามรายการ และปิดงานได้เมื่อครบ'],['4 · Workload Monitoring','ดูคำเตือน → ระบุวันเกินภาระ/คู่เวลาซ้อน → แก้หรือลบช่วง → ตรวจคำเตือนอีกครั้ง → เปิดงานใกล้ส่ง','แก้ตารางตัวอย่างวันนี้ให้ไม่มีเวลาซ้อนและไม่เกิน 3 ชั่วโมง โดยแบ่งงานไปวันอื่นก่อนส่ง','คำเตือนลดลงหลังแก้จริง และเปิดงานจาก Smart Reminder ได้'],['5 · Focus & Motivation','เลือกงาน → เลือกสิ่งรบกวนจำลอง → เริ่ม → หยุด/ทำต่อ → ครบเวลา → พัก → ตรวจ Streak และ Badges','เริ่มโฟกัส 25 นาที เลือกบล็อกโซเชียล หยุดและทำต่อ ใช้ “จำลองครบเวลา” แล้วพัก','เข้าใจสถานะโฟกัส/พัก Streak เพิ่ม และรางวัลก้าวแรกปลดล็อก']];$('view').innerHTML=head('ชุดทดสอบ Prototype','ขอบเขตตามส่วน Functions & Features ใน Ideate.docx')+`<div class="note">มีทั้ง 5 Functions รวม Focus & Motivation แม้รายการ Idea Selection ด้านบนเอกสารกล่าวถึงเพียง 5 แนวคิดหลัก • ชุดนี้ใช้รายชื่อ Features ตอนท้ายเป็นขอบเขต • ยังไม่ใช่ผลทดสอบผู้ใช้จริง</div><div class="actions"><button onclick="toggleMode()">สลับ Wireframe / Interactive</button><button onclick="resetData()">รีเซ็ตก่อนทดสอบคนถัดไป</button></div>${flows.map(([h,f,t,c])=>`<section class="flow"><h2>${h}</h2><strong>Flow</strong><p>${f}</p><strong>ภารกิจทดสอบ</strong><p>${t}</p><strong>เกณฑ์สำเร็จ</strong><p>${c}</p></section>`).join('')}<section class="card"><h2>วิธีเก็บผล</h2><p>ใช้รหัส P01–P08 ขอความยินยอมก่อนบันทึกภาพ/เสียง ให้ผู้ใช้ทำเองและเล่าความคิด โดยผู้ดำเนินการไม่ชี้ปุ่มก่อนผู้ใช้ลอง</p><p>บันทึก: ภารกิจ / สำเร็จหรือไม่ / เวลาที่ใช้ / จุดที่ติดขัด / จำนวนครั้งที่ช่วย / ความง่าย 1–5 / คำพูดจริง / สิ่งที่จะปรับ</p><h3>กรณีผิดพลาดที่ต้องลอง</h3><p>เว้นชื่องานว่าง · เวลาสิ้นสุดก่อนเริ่ม · จัดช่วงทับงานอื่น · จัดเวลาเกินวันส่ง · งานไม่มีขั้นตอนย่อย · ยกเลิกโฟกัสก่อนครบ</p><h3>ขอบเขตการจำลอง</h3><p>Priority เป็นสูตรสาธิต การประเมินเวลามาจากผู้ใช้ การเตือนแสดงในหน้าเว็บ App Blocker เป็นสถานะจำลอง ไม่มีการบล็อกเครื่องจริง ไม่มีการส่งข้อความหรือเชื่อมบริการภายนอก</p><p>ข้อมูลเก็บเฉพาะเบราว์เซอร์ การย้ายเครื่องหรือใช้โหมดส่วนตัวอาจไม่เก็บข้อมูล ตัวจับเวลาไม่ทำต่อเมื่อปิดหน้าเว็บ</p></section>`}
render();
