'use strict';

const dateKey=(n=0)=>{let d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pretty=d=>new Date(d+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'}),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const seed=()=>({tasks:[{id:'a',name:'ออกแบบ Prototype HCI',course:'HCI',due:dateKey(2),score:30,difficulty:4,hours:5,done:false,subs:[{name:'ร่าง Wireframe',done:true},{name:'เชื่อมหน้าจอ',done:false},{name:'เตรียมโจทย์ทดสอบ',done:false}]},{id:'b',name:'แบบฝึกหัด Data Structures',course:'Data Structures',due:dateKey(1),score:10,difficulty:5,hours:3,done:false,subs:[{name:'อ่านโจทย์และวางวิธีทำ',done:false},{name:'เขียนและตรวจโค้ด',done:false}]},{id:'c',name:'สรุปบทความวิจัย',course:'Research',due:dateKey(4),score:20,difficulty:3,hours:4,done:false,subs:[]}],slots:[{id:'s1',task:'a',date:dateKey(),time:'18:00',minutes:120},{id:'s2',task:'b',date:dateKey(),time:'19:00',minutes:120},{id:'s3',task:'c',date:dateKey(),time:'20:00',minutes:90}],capacity:3,order:null,focusDays:[],sessions:0});

const task=id=>state.tasks.find(t=>t.id===id),active=()=>state.tasks.filter(t=>!t.done),days=t=>Math.ceil((new Date(t.due+'T00:00:00')-new Date(dateKey()+'T00:00:00'))/86400000);

function ranked(){let a=active().sort((a,b)=>points(b)-points(a));if(state.order)a.sort((a,b)=>state.order.indexOf(a.id)-state.order.indexOf(b.id));return a}

const mins=s=>{let [h,m]=s.split(':').map(Number);return h*60+m},hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function conflicts(){let a=state.slots.filter(s=>task(s.task)&&!task(s.task).done),out=[];a.forEach((s,i)=>a.slice(i+1).forEach(t=>{if(s.date===t.date&&mins(s.time)<mins(t.time)+t.minutes&&mins(t.time)<mins(s.time)+s.minutes)out.push([s,t])}));return out}
function loads(){let m={};state.slots.filter(s=>task(s.task)&&!task(s.task).done).forEach(s=>m[s.date]=(m[s.date]||0)+s.minutes);return Object.entries(m).filter(([d,n])=>n>state.capacity*60)}
function head(title,sub,action=''){return `<div class="page-head"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}
function taskRow(t){return `<div class="task"><div><span class="tag">${esc(t.course)}</span><span class="tag ${days(t)<=1?'warn':''}">ส่ง ${pretty(t.due)}</span><h3>${esc(t.name)}</h3><p>เหลือประมาณ ${t.hours} ชม. · คะแนนงาน ${t.score} · ความยาก ${t.difficulty}/5</p><progress value="${progress(t)}" max="100" aria-label="ความคืบหน้า"></progress><p>เสร็จ ${progress(t)}%</p></div><div class="actions"><button onclick="detail('${t.id}')">ดูงานย่อย</button><button onclick="editTask('${t.id}')">แก้ไข</button></div></div>`}
function render(){document.body.classList.toggle('wire',wire);$('mode').textContent=wire?'ดู Interactive Prototype':'ดู Wireframe';$('today').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});let nav=[['home','หน้าหลัก'],['tasks','งานทั้งหมด'],['priority','ลำดับความสำคัญ'],['plan','ตารางเวลา'],['alerts','ภาระงานและแจ้งเตือน'],['focus','สมาธิและรางวัล']];$('nav').innerHTML=nav.map(([p,n])=>`<button class="${page===p?'active':''}" ${page===p?'aria-current="page"':''} onclick="go('${p}')">${n}</button>`).join('');({home:homeView,tasks:tasksView,priority:priorityView,plan:planView,alerts:alertsView,focus:focusView,guide:guideView}[page]||homeView)()}
function homeView(){let next=ranked()[0];$('view').innerHTML=head('ค่อย ๆ ทำให้ครบ ทีละงาน','เห็นงานที่สำคัญ แล้วจัดเวลาให้พอดี',`<button class="primary" onclick="editTask()">＋ เพิ่มงาน</button>`)+`<div class="grid stats"><div class="stat"><small>งานที่ยังต้องทำ</small><strong>${active().length}</strong>งาน</div><div class="stat"><small>เวลาโดยประมาณที่เหลือ</small><strong>${active().reduce((a,t)=>a+t.hours,0)}</strong>ชั่วโมง</div><div class="stat"><small>งานที่มีแผนแล้ว</small><strong>${active().filter(t=>state.slots.some(s=>s.task===t.id)).length}</strong>งาน</div><div class="stat"><small>งานเสร็จแล้ว</small><strong>${state.tasks.filter(t=>t.done).length}</strong>งาน</div></div><div class="grid two"><section class="card"><h2>งานที่แนะนำให้เริ่ม</h2>${ranked().slice(0,3).map(taskRow).join('')||'<p class="empty">ไม่มีงานค้าง เพิ่มงานใหม่เมื่อพร้อม</p>'}<button onclick="go('priority')">ดูเหตุผลและปรับลำดับ →</button></section><div class="grid"><section class="card hero"><span class="eyebrow" style="color:inherit">MAKE ROOM TO FOCUS</span><h2>ให้เวลากับงานตรงหน้า</h2><p class="muted">${next?esc(next.name):'เริ่มงานใหม่ แล้วค่อยแบ่งเวลาทำ'}</p><button onclick="go('focus')">เริ่มช่วงมีสมาธิ →</button></section><section class="card"><h2>แผนวันนี้เป็นอย่างไร?</h2><p>${loads().length} วันที่มีงานเกินเวลาที่ตั้งไว้<br>${conflicts().length} คู่เวลาที่ทับซ้อนกัน</p><button onclick="go('alerts')">ตรวจและปรับแผน</button></section></div></div>`}
function tasksView(){$('view').innerHTML=head('งานทั้งหมด','จัดการงานทุกวิชาในที่เดียว',`<button class="primary" onclick="editTask()">＋ เพิ่มงาน</button>`)+`<section class="card">${active().map(taskRow).join('')||'<div class="empty">ยังไม่มีงานที่ค้างอยู่</div>'}</section><section class="card" style="margin-top:20px"><h2>ทำเสร็จแล้ว</h2>${state.tasks.filter(t=>t.done).map(t=>`<div class="task"><div>${esc(t.name)} <span class="tag">เสร็จแล้ว</span></div><div class="actions"><button onclick="detail('${t.id}')">ดูรายละเอียดและงานย่อย</button><button onclick="reopen('${t.id}')">นำกลับมาทำต่อ</button></div></div>`).join('')||'<p class="muted">งานที่ทำเสร็จจะปรากฏที่นี่</p>'}</section>`}
function editTask(id){let t=id?task(id):{name:'',course:'',due:dateKey(2),score:10,difficulty:3,hours:2};openModal(`<div class="dialog-head"><h2>${id?'แก้ไขงาน':'เพิ่มงานใหม่'}</h2><button onclick="closeModal()" aria-label="ปิด">×</button></div><form onsubmit="saveTask(event,'${id||''}')"><div class="fields"><div class="field-full"><label for="name">ชื่องาน *</label><input id="name" required maxlength="100" value="${esc(t.name)}"></div><div><label for="course">วิชา *</label><input id="course" required maxlength="60" value="${esc(t.course)}"></div><div><label for="due">กำหนดส่ง *</label><input id="due" required type="date" value="${t.due}"></div><div><label for="score">คะแนนของงาน (0–100)</label><input id="score" type="number" required min="0" max="100" value="${t.score}"></div><div><label for="difficulty">ความยาก</label><select id="difficulty">${[1,2,3,4,5].map(i=>`<option value="${i}" ${t.difficulty===i?'selected':''}>${i} / 5 ${i===1?'ง่าย':i===5?'ยากมาก':''}</option>`).join('')}</select></div><div class="field-full"><label for="hours">เวลาที่คาดว่ายังต้องใช้ (ชั่วโมง)</label><input id="hours" type="number" required min="0.25" max="200" step="0.25" value="${t.hours}"></div></div><p class="note">แก้แผนประเมินได้เมื่อเริ่มทำจริง ระบบใช้ข้อมูลนี้ประกอบคำแนะนำ</p><p id="taskError" class="error" role="alert"></p><div class="actions"><button type="button" onclick="closeModal()">ยกเลิก</button><button class="primary">บันทึกงาน</button></div></form>`)}
function saveTask(e,id){e.preventDefault();let name=$('name').value.trim(),course=$('course').value.trim();if(!name||!course){$('taskError').textContent='กรุณากรอกชื่องานและวิชา';return}let fields={name,course,due:$('due').value,score:+$('score').value,difficulty:+$('difficulty').value,hours:+$('hours').value};if(id)Object.assign(task(id),fields);else state.tasks.push({id:uid(),...fields,done:false,subs:[]});state.order=null;save();closeModal();render();toast('บันทึกแล้ว และอัปเดตคำแนะนำลำดับงาน')}
function priorityView(){let list=ranked();$('view').innerHTML=head('เลือกงานที่ควรเริ่มก่อน','ตรวจเหตุผล แล้วปรับให้เหมาะกับสถานการณ์ของคุณ')+`<section class="card"><div class="actions"><button onclick="state.order=null;save();render()">ใช้ลำดับแนะนำ</button><button onclick="sortBy('due')">เรียงตามวันส่ง</button><button onclick="sortBy('score')">เรียงตามคะแนนงาน</button></div><details class="note"><summary>คะแนนความสำคัญคิดอย่างไร?</summary><p>สูตรจำลองสำหรับต้นแบบ: ความใกล้วันส่ง 0–40 + คะแนนงาน 0–25 + ความยาก 4–20 + เวลาที่เหลือ 0–15 รวมสูงสุด 100 คะแนน ยังไม่ได้ปรับเทียบด้วยข้อมูลจริง ผู้ใช้เปลี่ยนลำดับได้เสมอ</p></details>${list.map((t,i)=>`<div class="task"><div class="line"><span class="rank">${i+1}</span><div><h3>${esc(t.name)}</h3><span class="tag">Priority ${Math.round(points(t))}/100</span><p>${days(t)<0?'เกินกำหนดแล้ว':`เหลือ ${days(t)} วัน`} · ความยาก ${t.difficulty}/5 · ต้องใช้ ${t.hours} ชม. · คะแนนงาน ${t.score}</p></div></div><div class="actions"><button ${i===0?'disabled':''} onclick="moveRank('${t.id}',-1)" aria-label="เลื่อน ${esc(t.name)} ขึ้น">↑</button><button ${i===list.length-1?'disabled':''} onclick="moveRank('${t.id}',1)" aria-label="เลื่อน ${esc(t.name)} ลง">↓</button><button onclick="slotForm('', '${t.id}')">จัดเวลา</button></div></div>`).join('')||'<p class="empty">ไม่มีงานให้จัดลำดับ</p>'}</section>`}
function sortBy(k){state.order=active().sort((a,b)=>k==='due'?a.due.localeCompare(b.due):b.score-a.score).map(t=>t.id);save();render();toast('เปลี่ยนลำดับแล้ว')}
function moveRank(id,dir){let ids=ranked().map(t=>t.id),i=ids.indexOf(id);[ids[i],ids[i+dir]]=[ids[i+dir],ids[i]];state.order=ids;save();render()}
function detail(id){let t=task(id);openModal(`<div class="dialog-head"><h2>${esc(t.name)}</h2><button onclick="closeModal()" aria-label="ปิด">×</button></div><p class="muted">${esc(t.course)} · ส่ง ${pretty(t.due)}</p><progress value="${progress(t)}" max="100"></progress><p>เสร็จ ${t.subs.filter(s=>s.done).length}/${t.subs.length} ขั้นตอน (${progress(t)}%)</p>${t.subs.map((s,i)=>`<div class="subtask"><label><input type="checkbox" ${s.done?'checked':''} onchange="checkSub('${id}',${i},this.checked)">${esc(s.name)}</label><button onclick="removeSub('${id}',${i})" aria-label="ลบขั้นตอน ${esc(s.name)}">ลบ</button></div>`).join('')||'<p class="empty">แบ่งงานเป็นขั้นตอนเล็ก ๆ เพื่อเริ่มได้ง่ายขึ้น</p>'}<form onsubmit="addSub(event,'${id}')"><label for="subname">ขั้นตอนใหม่</label><div class="line"><input id="subname" required maxlength="100" placeholder="เช่น ร่างโครงหน้าจอ"><button>เพิ่ม</button></div></form><div class="actions" style="margin-top:20px"><button onclick="closeModal();slotForm('', '${id}')">จัดแผนรายวัน</button><button class="primary" onclick="complete('${id}')" ${t.subs.some(s=>!s.done)?'disabled':''}>ทำงานนี้เสร็จแล้ว</button></div>${t.subs.some(s=>!s.done)?'<p class="muted">ทำรายการย่อยให้ครบก่อนปิดงาน</p>':''}`)}
function checkSub(id,i,v){task(id).subs[i].done=v;save();detailRefresh(id)}function detailRefresh(id){closeModal();render();detail(id)}function addSub(e,id){e.preventDefault();let n=$('subname').value.trim();if(!n)return;task(id).subs.push({name:n,done:false});save();detailRefresh(id)}function removeSub(id,i){task(id).subs.splice(i,1);save();detailRefresh(id)}function complete(id){task(id).done=true;state.order=null;save();closeModal();render();toast('งานเสร็จแล้ว! ตรวจรางวัลได้ในหน้าสมาธิและรางวัล')}function reopen(id){task(id).done=false;save();render()}
function planView(){$('view').innerHTML=head('จัดเวลาให้แต่ละงาน','รวมทุกวิชาไว้ในแผนเดียว และเผื่อเวลาให้ชีวิตประจำวัน',`<button class="primary" onclick="editTask()">＋ เพิ่มงาน</button>`)+`<div class="card" style="margin-bottom:20px"><form class="capacity-form" onsubmit="saveAvailability(event)"><div class="fields"><div><label for="cap">เวลาทำงานสูงสุดต่อวัน (ชั่วโมง)</label><input id="cap" type="number" min="0.5" max="12" step="0.5" required value="${state.capacity}"></div></div><p id="avError" class="error"></p><button>บันทึกชั่วโมงสูงสุด</button></form></div><div class="actions" style="margin-bottom:12px"><button onclick="week--;render()">← ก่อนหน้า</button><button onclick="week=0;render()">วันนี้</button><button onclick="week++;render()">ถัดไป →</button></div><div class="calendar">${Array.from({length:7},(_,i)=>{let date=dateKey(week*7+i),slots=state.slots.filter(s=>s.date===date&&task(s.task)&&!task(s.task).done).sort((a,b)=>(a.time||'').localeCompare(b.time||'')),total=slots.reduce((a,s)=>a+s.minutes,0);return `<section class="day"><h3>${pretty(date)} ${date===dateKey()?'· วันนี้':''}</h3><small class="${total>state.capacity*60?'warn':''}">${(total/60).toFixed(1)} / ${state.capacity} ชม.</small>${slots.map(s=>`<div class="slot"><strong>${(s.minutes/60).toFixed(1)} ชม.</strong><br>${esc(task(s.task).name)}<br><button onclick="slotForm('${s.id}')">แก้แผน</button></div>`).join('')}${active().filter(t=>t.due===date).map(t=>`<div class="due">กำหนดส่ง: ${esc(t.name)}</div>`).join('')}</section>`}).join('')}</div><section class="card"><h2>เวลาที่วางแผนเทียบกับเวลาที่ต้องใช้</h2>${active().map(t=>{let n=state.slots.filter(s=>s.task===t.id&&s.date>=dateKey()).reduce((a,s)=>a+s.minutes,0)/60;return `<div class="task"><div>${esc(t.name)}<p>จัดไว้ ${n.toFixed(1)} / ต้องใช้ ${t.hours} ชั่วโมง</p></div><button onclick="slotForm('', '${t.id}')">เพิ่มช่วงเวลา</button></div>`}).join('')}</section>`}
function saveAvailability(e){e.preventDefault();state.capacity=+$('cap').value;save();render();toast('บันทึกชั่วโมงสูงสุดต่อวันแล้ว')}
function slotForm(id='',tid=''){if(!active().length){toast('เพิ่มงานก่อนจัดเวลา');return}let s=id?state.slots.find(s=>s.id===id):{task:tid||active()[0].id,date:dateKey(),time:'09:00',minutes:60};openModal(`<div class="dialog-head"><h2>${id?'ปรับแผนรายวัน':'เพิ่มแผนรายวัน'}</h2><button onclick="closeModal()" aria-label="ปิด">×</button></div><form onsubmit="saveSlot(event,'${id}')"><label for="slotTask">งาน</label><select id="slotTask">${active().map(t=>`<option value="${t.id}" ${s.task===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div class="fields"><div><label for="slotDate">วันที่</label><input id="slotDate" type="date" min="${dateKey()}" required value="${s.date}"></div><div><label for="slotTime">เวลาเริ่ม</label><input id="slotTime" type="time" required value="${s.time}"></div><div><label for="slotMinutes">ระยะเวลา (นาที)</label><input id="slotMinutes" type="number" required min="15" max="480" step="15" value="${s.minutes}"></div></div><p id="slotError" class="error" role="alert"></p><div class="actions"><button type="button" onclick="closeModal()">ยกเลิก</button>${id?`<button class="danger" type="button" onclick="removeSlot('${id}')">ลบช่วงนี้</button>`:''}<button class="primary">ตรวจและบันทึก</button></div></form>`)}
function saveSlot(e,id){e.preventDefault();let s={id:id||uid(),task:$('slotTask').value,date:$('slotDate').value,time:$('slotTime').value,minutes:+$('slotMinutes').value},end=mins(s.time)+s.minutes,other=state.slots.filter(x=>x.id!==id&&task(x.task)&&!task(x.task).done);let err='';if(end>1440)err='แผนรายวันต้องสิ้นสุดภายในวันเดียวกัน';else if(s.date>task(s.task).due)err='ช่วงเวลานี้เลยกำหนดส่ง กรุณาเลือกวันก่อนหรือเท่ากับวันส่ง';else {let clash=other.find(x=>x.date===s.date&&mins(x.time)<end&&mins(s.time)<mins(x.time)+x.minutes);if(clash)err='เวลาทับซ้อนกับ “'+task(clash.task).name+'” กรุณาเลือกเวลาอื่น'}if(err){$('slotError').textContent=err;return}if(id)state.slots=state.slots.map(x=>x.id===id?s:x);else state.slots.push(s);save();closeModal();render();toast('บันทึกแผนรายวันแล้ว'+(loads().some(([d])=>d===s.date)?' · วันนี้เกินเวลาที่ตั้งไว้ ดูที่ภาระงานและแจ้งเตือน':''))}
function removeSlot(id){state.slots=state.slots.filter(s=>s.id!==id);save();closeModal();render();toast('ลบแผนรายวันแล้ว งานยังอยู่ในรายการ')}
function alertsView(){let cs=conflicts(),ls=loads(),due=active().filter(t=>days(t)<=2);$('view').innerHTML=head('ดูภาระงานก่อนล้นมือ','ตรวจเวลาทับซ้อน งานกระจุกตัว และงานใกล้ส่ง')+`<div class="grid two"><section class="card"><h2>แผนรายวัน</h2>${cs.map(([a,b])=>`<div class="alert"><strong>${pretty(a.date)} · ช่วงเวลาทับซ้อน</strong><p>${esc(task(a.task).name)} (${a.time}–${hm(mins(a.time)+a.minutes)})<br>${esc(task(b.task).name)} (${b.time}–${hm(mins(b.time)+b.minutes)})</p><button onclick="slotForm('${b.id}')">ปรับเวลา ${esc(task(b.task).course)}</button></div>`).join('')||'<p class="muted">แผนแสดงเฉพาะวันที่ต้องทำ ตรวจชั่วโมงรวมต่อวันด้านล่าง</p>'}<h2 style="margin-top:22px">ภาระงานเกินกำลัง · ${ls.length}</h2>${ls.map(([d,m])=>`<div class="alert"><strong>${pretty(d)} · จัดไว้ ${(m/60).toFixed(1)} ชั่วโมง</strong><p>เกินชั่วโมงสูงสุดที่กำหนดไว้ ${state.capacity} ชั่วโมงต่อวัน</p><button onclick="go('plan')">แบ่งหรือย้ายแผนรายวัน</button></div>`).join('')||'<p class="muted">ทุกวันอยู่ในขอบเขตเวลาที่ตั้งไว้</p>'}</section><section class="card"><h2>แจ้งเตือนงานใกล้ส่ง</h2><p class="muted">จำลองการเตือนภายในแอป สำหรับงานที่ส่งภายใน 2 วัน</p>${due.map(t=>`<div class="task"><div><span class="tag warn">${days(t)<0?'เกินกำหนด':days(t)===0?'ส่งวันนี้':`อีก ${days(t)} วัน`}</span><h3>${esc(t.name)}</h3><p>${esc(t.course)} · ${pretty(t.due)}<br>ขั้นตอนที่ยังค้าง: ${t.subs.filter(s=>!s.done).length} · เหลือประมาณ ${t.hours} ชั่วโมง</p><button onclick="detail('${t.id}')">เปิดงาน</button></div></div>`).join('')||'<p class="empty">ไม่มีงานใกล้กำหนดส่ง</p>'}</section></div>`}
function streak(){let n=0,d=0;if(!state.focusDays.includes(dateKey()))d=1;while(state.focusDays.includes(dateKey(-d))){n++;d++}return n}

// Allocate whole minutes by chosen task order, with a daily capacity and deadline.
function allocatePlan(list,capacity,today){
 const cap=Math.floor(Number(capacity)*60),used={},slots=[],unplaced=[];
 if(!Number.isFinite(cap)||cap<1)throw Error('กรุณากำหนดชั่วโมงสูงสุดต่อวันให้ถูกต้อง');
 for(const t of list){
  let remaining=Math.round(Number(t.hours)*60);
  if(!Number.isFinite(remaining)||remaining<=0)continue;
  let cursor=new Date(today+'T12:00:00'),limit=new Date(t.due+'T12:00:00');
  while(cursor<=limit&&remaining>0){
   const key=localDay(cursor),free=cap-(used[key]||0),take=Math.min(free,remaining);
   if(take>0){slots.push({id:'auto-'+slots.length+'-'+t.id,task:t.id,date:key,time:hm(540+(used[key]||0)),minutes:take,auto:true});used[key]=(used[key]||0)+take;remaining-=take;}
   cursor.setDate(cursor.getDate()+1);
  }
  if(remaining>0)unplaced.push({id:t.id,minutes:remaining});
 }
 return {slots,unplaced};
}

function applyAutoPlan(){
 if(!pendingAutoPlan)return;
 state.slots=state.slots.filter(s=>s.date<dateKey()||!task(s.task)||task(s.task).done).concat(pendingAutoPlan.slots);
 const missing=pendingAutoPlan.unplaced.length;pendingAutoPlan=null;save();closeModal();monthOffset=0;go('plan');toast(missing?'บันทึกแผนแล้ว บางงานยังมีเวลาไม่พอก่อนส่ง':'จัดลงปฏิทินเรียบร้อยแล้ว');
}
const priorityWithAuto=priorityView;
priorityView=function(){priorityWithAuto();const a=document.querySelector('#view .card .actions');a.insertAdjacentHTML('afterbegin','<button class="primary" onclick="previewAutoPlan()">จัดลงปฏิทินตามลำดับนี้ →</button>');};
const planWithAuto=planView;
planView=function(){planWithAuto();document.querySelector('#view .page-head').insertAdjacentHTML('afterend','<div class="note"><strong>จัดเวลาให้โดยอัตโนมัติ</strong><p>กำหนดชั่วโมงสูงสุดต่อวัน แล้วเรียงลำดับงาน ระบบจะแบ่งงานลงแต่ละวันให้ก่อนถึงกำหนดส่ง</p><div class="actions"><button class="primary" onclick="previewAutoPlan()">จัดปฏิทินอัตโนมัติ</button><button onclick="go(\'priority\')">ปรับลำดับงาน</button></div></div>');};

const planBeforeScroll=planView;
function chooseCalendar(mode){state.calendarMode=mode;save();render();}
function scrollMonthGrid(offset){
 const first=new Date(new Date().getFullYear(),new Date().getMonth()+offset,1),start=new Date(first);start.setDate(1-(first.getDay()+6)%7);
 const count=Math.ceil(((first.getDay()+6)%7+new Date(first.getFullYear(),first.getMonth()+1,0).getDate())/7)*7;
 return `<section class="scroll-month" data-offset="${offset}"><h2>${first.toLocaleDateString('th-TH',{month:'long',year:'numeric'})}</h2><div class="month-grid">${['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'].map(n=>`<div class="weekday">${n}</div>`).join('')}${Array.from({length:count},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);let key=localDay(d),events=[...state.slots.filter(s=>s.date===key&&task(s.task)&&!task(s.task).done).map(s=>({label:task(s.task).name+' · '+(s.minutes/60).toFixed(1)+' ชม.',action:`slotForm('${s.id}')`,cls:'planned'})),...active().filter(t=>t.due===key).map(t=>({label:'⚑ ส่ง '+t.name,action:`detail('${t.id}')`,cls:'deadline'}))];return `<section class="month-day ${d.getMonth()!==first.getMonth()?'outside':''} ${i%7>=5?'weekend':''}"><div class="day-top"><span class="${key===dateKey()?'today-number':''}">${d.getDate()}</span><button aria-label="เพิ่มงานวันที่ ${key}" onclick="addOnDay('${key}')">＋</button></div>${events.slice().sort((a,b)=>Number(b.cls==='deadline')-Number(a.cls==='deadline')).slice(0,2).map(e=>`<button class="event ${e.cls}" title="${esc(e.label)}" onclick="${e.action}">${esc(e.label)}</button>`).join('')}${events.length>2?`<button class="more" onclick="showDay('${key}')">+${events.length-2} รายการเพิ่มเติม</button>`:''}</section>`}).join('')}</div></section>`;
}
planView=function(){
 planBeforeScroll();
 const calendar=document.querySelector('.month-scroll');
 calendar.insertAdjacentHTML('beforebegin',`<div class="calendar-mode"><label for="calendarMode">รูปแบบปฏิทิน</label><select id="calendarMode" onchange="chooseCalendar(this.value)"><option value="classic" ${state.calendarMode!=='scroll'?'selected':''}>แบบเดือนเดียว</option><option value="scroll" ${state.calendarMode==='scroll'?'selected':''}>แบบหลายเดือน</option></select></div>`);
 const modeControl=document.querySelector('.calendar-mode');const toolbar=modeControl.previousElementSibling;toolbar.insertBefore(modeControl,toolbar.querySelector('button'));
 if(state.calendarMode!=='scroll')return;
 calendar.classList.add('multi-month-calendar');
 calendar.setAttribute('tabindex','0');calendar.setAttribute('role','region');calendar.setAttribute('aria-label','ปฏิทินหลายเดือน เลื่อนขึ้นหรือลงเพื่อเปลี่ยนเดือน');
 calendar.innerHTML=`<div class="scroll-hint">เลื่อนขึ้นเพื่อดูเดือนก่อนหน้า · เลื่อนลงเพื่อดูเดือนถัดไป</div><button class="extend-months" onclick="monthOffset-=12;render()">ดูช่วง 12 เดือนก่อนหน้า ↑</button>${Array.from({length:25},(_,i)=>scrollMonthGrid(monthOffset+i-12)).join('')}<button class="extend-months" onclick="monthOffset+=12;render()">ดูช่วง 12 เดือนถัดไป ↓</button>`;
 const center=calendar.querySelector(`[data-offset="${monthOffset}"]`);
 calendar.scrollTop=center.offsetTop-38;
};

function miniMonth(){
 const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1),start=new Date(first);start.setDate(1-(first.getDay()+6)%7);
 const count=Math.ceil(((first.getDay()+6)%7+new Date(now.getFullYear(),now.getMonth()+1,0).getDate())/7)*7;
 return `<section class="card hero dashboard-calendar"><h2>ปฏิทินเดือนนี้</h2><p class="muted">${now.toLocaleDateString('th-TH',{month:'long',year:'numeric'})}</p><div class="mini-month">${['จ','อ','พ','พฤ','ศ','ส','อา'].map(n=>`<span class="mini-weekday">${n}</span>`).join('')}${Array.from({length:count},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const key=localDay(d),scheduled=state.slots.filter(s=>s.date===key&&task(s.task)&&!task(s.task).done),due=active().filter(t=>t.due===key),has=scheduled.length+due.length;return `<button class="mini-date ${d.getMonth()!==now.getMonth()?'mini-outside':''} ${key===dateKey()?'mini-today':''}" aria-label="${pretty(key)} ${has?'มี '+has+' รายการ':'ไม่มีงาน'}" title="${pretty(key)} · ${has} รายการ" onclick="showDay('${key}')"><span>${d.getDate()}</span><span class="mini-dots">${scheduled.length?'<i></i>':''}${due.length?'<i class="deadline-dot"></i>':''}</span></button>`}).join('')}</div><p class="mini-legend"><span>● แผนรายวัน</span><span>● กำหนดส่ง</span></p><button onclick="monthOffset=0;go('plan')">เปิดปฏิทินเต็ม →</button></section>`;
}
function homeTaskSnippet(t,date,label){return `<button class="home-work" onclick="detail('${t.id}')"><span class="home-work-name">${esc(t.name)}</span><small>${esc(t.course)} · ${label} ${pretty(date)}</small></button>`}
const homeBeforeWidgets=homeView;
homeView=function(){
 homeBeforeWidgets();const side=document.querySelector('#view .grid.two > .grid');if(!side)return;
 const today=dateKey(),todayList=active().filter(t=>t.due<=today||state.slots.some(s=>s.task===t.id&&s.date===today));
 const soon=active().map(t=>{const candidates=[...(t.due>today?[{date:t.due,label:'กำหนดส่ง'}]:[]),...state.slots.filter(s=>s.task===t.id&&s.date>today).map(s=>({date:s.date,label:'มีแผนทำงาน'}))].sort((a,b)=>a.date.localeCompare(b.date));return candidates.length?{t,...candidates[0]}:null}).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));
 side.innerHTML=miniMonth()+`<section class="card dashboard-agenda"><h2>งานที่ต้องทำวันนี้ <span class="tag">${todayList.length}</span></h2>${todayList.length?todayList.map(t=>homeTaskSnippet(t,t.due,t.due<today?'เกินกำหนดส่ง':t.due===today?'ส่งวันนี้':'กำหนดส่ง')).join(''):'<p class="muted">วันนี้ยังไม่มีงานที่วางแผนไว้หรืองานถึงกำหนดส่ง</p>'}<h2 class="upcoming-title">งานที่กำลังจะมาถึง <span class="tag">${soon.length}</span></h2>${soon.length?soon.slice(0,5).map(x=>homeTaskSnippet(x.t,x.date,x.label)).join(''):'<p class="muted">ยังไม่มีงานที่กำลังจะมาถึง</p>'}${soon.length>5?`<p class="muted">และอีก ${soon.length-5} งาน</p>`:''}<button onclick="go('tasks')">ดูงานทั้งหมด →</button></section>`;
};

function applyTheme(mode){
 const dark=mode==='dark';document.body.classList.toggle('dark',dark);
 document.documentElement.style.colorScheme=dark?'dark':'light';
 const b=$('themeToggle');if(b){b.textContent=dark?'☀ โหมดสว่าง':'☾ โหมดมืด';b.setAttribute('aria-label',dark?'เปลี่ยนเป็นโหมดสว่าง':'เปลี่ยนเป็นโหมดมืด');b.setAttribute('aria-pressed',String(dark));}
}
function toggleTheme(){const mode=document.body.classList.contains('dark')?'light':'dark';try{localStorage.setItem('taskwise-theme',mode)}catch{}applyTheme(mode);}
let savedTheme;try{savedTheme=localStorage.getItem('taskwise-theme')}catch{}
applyTheme(savedTheme==='dark'||savedTheme==='light'?savedTheme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

function allocatePlan(list,capacity,today,existing=[]){
 const cap=Math.floor(Number(capacity)*60),used={},slots=[],unplaced=[];
 if(!Number.isFinite(cap)||cap<1)throw Error('กรุณากำหนดชั่วโมงสูงสุดต่อวันให้ถูกต้อง');
 for(const s of existing){if(s.date>=today)used[s.date]=(used[s.date]||0)+Number(s.minutes||0);}
 for(const t of list){let remaining=Math.round(Number(t.hours)*60);if(!Number.isFinite(remaining)||remaining<=0)continue;
  let cursor=new Date(today+'T12:00:00'),limit=new Date(t.due+'T12:00:00');
  while(cursor<=limit&&remaining>0){const date=localDay(cursor),take=Math.min(Math.max(0,cap-(used[date]||0)),remaining);if(take>0){slots.push({id:uid(),task:t.id,date,minutes:take,auto:true});used[date]=(used[date]||0)+take;remaining-=take;}cursor.setDate(cursor.getDate()+1);}
  if(remaining)unplaced.push({id:t.id,minutes:remaining});
 }return{slots,unplaced};
}
function unscheduledTasks(){return ranked().filter(t=>!state.slots.some(s=>s.task===t.id));}
function previewAutoPlan(){
 const list=unscheduledTasks();if(!list.length){toast('ไม่มีงานใหม่ที่ต้องจัด งานค้างทั้งหมดมีแผนในปฏิทินแล้ว');return;}
 try{pendingAutoPlan=allocatePlan(list,state.capacity,dateKey(),state.slots.filter(s=>task(s.task)&&!task(s.task).done));}catch(e){toast(e.message);return;}
 const p=pendingAutoPlan;openModal(`<div class="dialog-head"><h2>จัดแผนรายวัน</h2><button onclick="closeModal()" aria-label="ปิด">×</button></div><p>จัดเฉพาะงานที่ยังไม่มีแผนในปฏิทิน ตามลำดับที่เลือก โดยใช้ชั่วโมงที่เหลือของแต่ละวัน</p><div class="note">งานที่มีแผนแล้วและงานที่เสร็จแล้วจะไม่ถูกนำมาจัดซ้ำ แผนเดิมยังคงอยู่ ไม่มีการกำหนดเวลาเริ่ม</div>${p.unplaced.length?`<div class="alert"><strong>เวลายังไม่พอก่อนวันส่ง</strong>${p.unplaced.map(x=>`<p>${esc(task(x.id).name)} · ขาดอีก ${(x.minutes/60).toFixed(2)} ชั่วโมง</p>`).join('')}</div>`:''}<div class="table-wrap"><table><thead><tr><th>วัน</th><th>งาน</th><th>ชั่วโมง</th></tr></thead><tbody>${p.slots.map(s=>`<tr><td>${pretty(s.date)}</td><td>${esc(task(s.task).name)}</td><td>${(s.minutes/60).toFixed(2)}</td></tr>`).join('')}</tbody></table></div><div class="actions" style="margin-top:18px"><button onclick="closeModal()">ยกเลิก</button><button class="primary" onclick="applyAutoPlan()" ${p.slots.length?'':'disabled'}>เพิ่มแผนลงปฏิทิน</button></div>`);
}
function applyAutoPlan(){if(!pendingAutoPlan)return;const eligible=new Set(unscheduledTasks().map(t=>t.id));state.slots.push(...pendingAutoPlan.slots.filter(s=>eligible.has(s.task)));pendingAutoPlan=null;save();closeModal();monthOffset=0;go('plan');toast('เพิ่มแผนรายวันแล้ว');}
function conflicts(){return[];}
function slotForm(id='',tid=''){
 if(!active().length){toast('เพิ่มงานก่อนวางแผน');return;}
 const s=id?state.slots.find(s=>s.id===id):{task:tid||active()[0].id,date:dateKey(),minutes:60};
 openModal(`<div class="dialog-head"><h2>${id?'แก้แผนรายวัน':'เพิ่มแผนรายวัน'}</h2><button onclick="closeModal()" aria-label="ปิด">×</button></div><form onsubmit="saveSlot(event,'${id}')"><label for="slotTask">งาน</label><select id="slotTask">${active().map(t=>`<option value="${t.id}" ${s.task===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><label for="slotDate">วันที่ต้องทำ</label><input id="slotDate" type="date" min="${dateKey()}" required value="${s.date}"><label for="slotMinutes">เวลาที่แบ่งให้วันนี้ (นาที)</label><input id="slotMinutes" type="number" min="1" max="1440" required value="${s.minutes}"><p id="slotError" class="error"></p><div class="actions" style="margin-top:16px">${id?`<button type="button" onclick="removeSlot('${id}')">ลบแผนวันนี้</button>`:''}<button class="primary">บันทึกแผนรายวัน</button></div></form>`);
}
function saveSlot(e,id){e.preventDefault();const s={id:id||uid(),task:$('slotTask').value,date:$('slotDate').value,minutes:+$('slotMinutes').value};if(s.date>task(s.task).due){$('slotError').textContent='วันที่เลือกเลยกำหนดส่ง กรุณาเลือกใหม่';return;}if(id)state.slots=state.slots.map(x=>x.id===id?s:x);else state.slots.push(s);save();closeModal();render();toast('บันทึกแผนแล้ว'+(loads().some(([d])=>d===s.date)?' · ชั่วโมงรวมเกินที่กำหนด':''));}
function addOnDay(date){editTask();if($('due'))$('due').value=date;}
const detailBeforeDaily=detail;
detail=function(id){const t=task(id);if(t.done){openModal(`<div class="dialog-head"><h2>${esc(t.name)}</h2><button onclick="closeModal()" aria-label="ปิด">×</button></div><span class="tag">เสร็จแล้ว</span><p>${esc(t.course)} · กำหนดส่ง ${pretty(t.due)}</p><h3>คำอธิบายเพิ่มเติม</h3><p class="task-description">${esc(t.description||'ไม่ได้เพิ่มคำอธิบาย')}</p><h3>งานย่อยที่ทำไปแล้ว</h3>${t.subs.map(s=>`<p>${s.done?'✓':'○'} ${esc(s.name)}</p>`).join('')||'<p class="muted">ไม่มีงานย่อย</p>'}<button onclick="closeModal();reopen('${id}')">นำกลับมาทำต่อ</button>`);return;}detailBeforeDaily(id);$('modal').querySelector('progress').insertAdjacentHTML('beforebegin',`<h3>คำอธิบายเพิ่มเติม</h3><p class="task-description">${esc(t.description||'ไม่ได้เพิ่มคำอธิบาย')}</p>`);};
const editBeforeDescription=editTask;
editTask=function(id){editBeforeDescription(id);$('modal').querySelector('.fields').insertAdjacentHTML('beforeend',`<div class="field-full"><label for="description">คำอธิบายเพิ่มเติม (ไม่บังคับ)</label><textarea id="description" rows="3" maxlength="3000" placeholder="รายละเอียด ข้อกำหนด หรือสิ่งที่ต้องเตรียม">${esc(id?task(id).description||'':'')}</textarea></div>`);};
const saveBeforeDescription=saveTask;
saveTask=function(e,id){const desc=$('description').value.trim(),before=state.tasks.length,valid=$('name').value.trim()&&$('course').value.trim();saveBeforeDescription(e,id);if(valid&&(id||state.tasks.length>before)){(id?task(id):state.tasks[state.tasks.length-1]).description=desc;save();render();}};

let homeWeekOffset=0;
miniMonth=function(){
 return `<section class="home-week-section"><div class="home-week-toolbar"><h2>ปฏิทิน 7 วัน</h2><div class="actions"><button onclick="homeWeekOffset--;render()" aria-label="7 วันก่อนหน้า">‹</button><button onclick="homeWeekOffset=0;render()">วันนี้</button><button onclick="homeWeekOffset++;render()" aria-label="7 วันถัดไป">›</button><button onclick="monthOffset=0;go('plan')">เปิดปฏิทินเต็ม →</button></div></div><div class="home-week-grid">${Array.from({length:7},(_,i)=>{const date=dateKey(homeWeekOffset*7+i),slots=state.slots.filter(s=>s.date===date&&task(s.task)&&!task(s.task).done),due=active().filter(t=>t.due===date),hours=slots.reduce((n,s)=>n+s.minutes,0)/60;return `<section class="home-week-day ${date===dateKey()?'current-day':''}"><h3>${pretty(date)}${date===dateKey()?' · วันนี้':''}</h3><p class="${hours>state.capacity?'warn':'muted'}">${hours.toFixed(1)} / ${state.capacity} ชม.</p>${due.map(t=>`<button class="week-deadline" onclick="detail('${t.id}')">กำหนดส่ง: ${esc(t.name)}</button>`).join('')}${slots.map(s=>`<button class="week-planned" onclick="detail('${s.task}')">${esc(task(s.task).name)}<small>${(s.minutes/60).toFixed(1)} ชม.</small></button>`).join('')}</section>`}).join('')}</div></section>`;
};
const homeBeforeWeekLayout=homeView;
homeView=function(){homeBeforeWeekLayout();const layout=document.querySelector('#view .grid.two'),calendar=layout.querySelector('.home-week-section'),agenda=layout.querySelector('.dashboard-agenda'),recommended=layout.firstElementChild;if(calendar&&agenda){layout.before(calendar);layout.replaceChildren(agenda,recommended);}};

render();
</script></body></html>
